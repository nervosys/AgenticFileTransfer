[package]
name = "aft"
version = "1.3.1"
edition = "2021"
rust-version = "1.75"
description = "Agentic File Transfer — An agentic-first, high-performance file transfer CLI for humans and AI agents"
license = "AGPL-3.0-or-later"
authors = ["Nervosys"]
repository = "https://github.com/nervosys/AgenticFileTransfer"
keywords = ["file-transfer", "cli", "agentic", "curl", "wget"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "aft"
path = "src/main.rs"

[lib]
name = "aft"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "1"
anyhow = "1"
colored = "2"
indicatif = "0.17"
futures = "0.3"
sha2 = "0.10"
md5 = { package = "md-5", version = "0.10" }
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
zstd = "0.13"

# FTP/FTPS support
suppaftp = { version = "6", features = ["async-rustls"] }

# SFTP/SCP support
# russh 0.52+ folded the former `russh-keys` crate in as `russh::keys`
# (RUSTSEC-2026-0154/0153); the SFTP handler uses it via that path.
russh = "0.62"
russh-sftp = "2.3"

# S3 support
rust-s3 = { version = "0.37", default-features = false, features = [
    "tokio-rustls-tls",
] }

# TLS for AFTP
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
webpki-roots = "0.26"

# Username detection
whoami = "1"

# Config file
toml = "0.8"
dirs = "6"

# HMAC for AFTP challenge/response auth
hmac = "0.12"

# WebSocket transport
tokio-tungstenite = "0.24"

# QUIC transport
quinn = "0.11"
# Zero-copy byte buffers for QUIC datagrams (the FEC QUIC data plane); already
# in-tree transitively via quinn, pinned here as a direct dependency.
bytes = "1"

# Plugin system
libloading = "0.8"

# Random nonce generation
rand = "0.8"

# URL encoding for cloud storage APIs
urlencoding = "2"

# Post-quantum key encapsulation: ML-KEM-1024 (NIST FIPS 203 final).
# Replaced the unmaintained `pqc_kyber` (round-3 Kyber, KyberSlash timing
# side-channel with no upstream fix) with RustCrypto's maintained `ml-kem`.
# This is a deliberate algorithm change: ML-KEM-1024 keys/ciphertexts are NOT
# interoperable with the old Kyber1024 ones, so pqc.rs bumps its key-file
# version and rejects legacy files (regenerate with `aft keygen`).
# `getrandom` enables the no-arg generate_keypair()/encapsulate() that use the
# system RNG — avoids threading our rand 0.8 OsRng across ml-kem's newer
# rand_core version boundary.
ml-kem = { version = "0.3", features = ["getrandom"] }

# AES-256-GCM authenticated encryption
aes-gcm = "0.10"

# Hardware-accelerated CRC32 (SSE4.2 on x86_64, CRC32 on aarch64)
crc32fast = "1.4"

# Self-signed cert generation for QUIC dev mode
rcgen = "0.13"

# RaptorQ fountain coding (RFC 6330) for the AFTP FEC data plane
raptorq = "2"

# Optional: FIPS 140-3 validated crypto backend. Enable with
# `cargo build --features fips`. Selects aws-lc-rs for the rustls TLS provider
# (server.rs) AND for the FEC data-plane AEAD/KDF (src/aftp/fec/symcrypto.rs);
# without it those use the RustCrypto aes-gcm/hmac crates.
aws-lc-rs = { version = "1", optional = true }

# NOTE: the three dependencies above are used unconditionally by src/aftp/
# (CRC32 framing, QUIC dev certs, the FIPS backend). They must stay in the
# top-level [dependencies] table. They previously sat below the
# cfg(windows) header, which TOML scoped into that table and silently made
# the whole crate Windows-only — it did not compile on Linux or macOS.
# Anything added past this point belongs to a target-specific table.

# Memory-mapped I/O for turbo transfers
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows system APIs for mmap and socket tuning
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
] }

[features]
default = []
fips = ["aws-lc-rs"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "primitives"
harness = false

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "transfer"
harness = false
