[package]
name = "aft"
version = "2.0.0"
edition = "2021"
rust-version = "1.75"
description = "Agentic File Transfer — An agentic-first, high-performance file transfer CLI for humans and AI agents"
license = "AGPL-3.0-or-later"
authors = ["Nervosys"]
repository = "https://github.com/nervosys/AgenticFileTransfer"
homepage = "https://github.com/nervosys/AgenticFileTransfer"
readme = "README.md"
keywords = ["file-transfer", "cli", "agentic", "curl", "wget"]
categories = ["command-line-utilities", "network-programming"]
# Keep the packaged crate lean: the marketing website and benchmark corpus are
# not needed to build or use the tool.
exclude = ["/website", "/bench", "/.github"]

[[bin]]
name = "aft"
path = "src/main.rs"

[lib]
name = "aft"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "1"
anyhow = "1"
colored = "2"
indicatif = "0.17"
futures = "0.3"
md5 = { package = "md-5", version = "0.10" }
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
zstd = "0.13"

# FTP/FTPS support
suppaftp = { version = "6", features = ["async-rustls"] }

# SFTP/SCP support
# russh 0.52+ folded the former `russh-keys` crate in as `russh::keys`
# (RUSTSEC-2026-0154/0153); the SFTP handler uses it via that path.
russh = "0.62"
russh-sftp = "2.3"

# S3 support
rust-s3 = { version = "0.37", default-features = false, features = [
    "tokio-rustls-tls",
] }

# TLS for AFTP
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
webpki-roots = "0.26"

# Username detection
whoami = "1"

# Config file
toml = "0.8"
dirs = "6"

# WebSocket transport
tokio-tungstenite = "0.24"

# QUIC transport
quinn = "0.11"
# Zero-copy byte buffers for QUIC datagrams (the FEC QUIC data plane); already
# in-tree transitively via quinn, pinned here as a direct dependency.
bytes = "1"

# Plugin system
libloading = "0.8"

# Random number generator for the neural cipher's seeded (deterministic) PRNG.
# Not used for any cryptographic key, nonce, or session value: those come from
# crate::crypto::primitives, which is backed by IronCrypto.
rand = "0.8"

# URL encoding for cloud storage APIs
urlencoding = "2"

# IronCrypto (the IronSecurity stack) is the sole source of AFT's cryptographic
# primitives. All use goes through src/crypto/primitives.rs, the one boundary:
#   ic-core    OS entropy, traits, and error types
#   ic-hash    SHA-256 and SHA-512
#   ic-mac     HMAC-SHA256 (AFTP challenge/response, symbol-key KDF)
#   ic-cipher  AES-256-GCM (FEC symbols, PQC payloads)
#   ic-mlkem   ML-KEM-1024 (NIST FIPS 203) key encapsulation
#   ic-rustls  rustls CryptoProvider, used for every TLS, QUIC, and FTPS session
ic-core = "0.2.24"
ic-hash = "0.2.24"
ic-mac = "0.2.24"
ic-cipher = "0.2.24"
ic-mlkem = "0.2.24"
ic-rustls = "0.2.24"

# OTLP (OpenTelemetry) protobuf message types for telemetry export
# (src/telemetry.rs). `gen-tonic-messages` provides the prost-generated structs
# (we encode them ourselves and POST over HTTP — no gRPC/tonic transport); the
# `logs` feature gates the logs signal's message types. It transitively pulls
# opentelemetry + opentelemetry_sdk (the crate's logs conversions); we use only
# the message structs.
opentelemetry-proto = { version = "0.27", default-features = false, features = [
    "gen-tonic-messages",
    "logs",
] }
prost = "0.13"

# Hardware-accelerated CRC32 (SSE4.2 on x86_64, CRC32 on aarch64)
crc32fast = "1.4"

# Self-signed cert generation for QUIC dev mode
rcgen = "0.13"

# RaptorQ fountain coding (RFC 6330) for the AFTP FEC data plane
raptorq = "2"

# Optional: IronCrypto's FIPS mode. Enable with `cargo build --features fips`.
# Runs the FIPS power-on self-tests at startup and refuses to run if they fail.
ic-fips = { version = "0.2.24", optional = true }

# NOTE: the dependencies above are used unconditionally by src/aftp/ (CRC32
# framing, QUIC dev certs, the crypto boundary). They must stay in the
# top-level [dependencies] table. They previously sat below the
# cfg(windows) header, which TOML scoped into that table and silently made
# the whole crate Windows-only — it did not compile on Linux or macOS.
# Anything added past this point belongs to a target-specific table.

# Memory-mapped I/O for turbo transfers
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows system APIs for mmap and socket tuning
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Memory",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
] }

[features]
default = []
fips = ["dep:ic-fips"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"
# Independent SHA-2 implementation, used only as a reference in the integration
# tests: they check IronCrypto's digests against it. Not part of the shipped binary.
sha2 = "0.10"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "primitives"
harness = false

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "transfer"
harness = false
